# General
maven_group = "mirsario"
root_package = "mirsario.cameraoverhaul"
archives_base_name = "CameraOverhaul"

# Mod Properties
mod.id = "cameraoverhaul"
mod.name = "CameraOverhaul"
mod.version = "2.0.6"
mod.version_type = "release"
mod.description = """
CameraOverhaul is a highly configurable clientside Minecraft mod that attempts to improve overall satisfaction of the game through the introduction of various camera rotations, emphasizing on the player's movement and improving visual feedback.
Strafing and turning around will tilt the camera sideways. Jumping, falling, and moving forward or backwards will affect the camera's pitch.
Nearby explosions will shake the screen, and ceasing movement for enough time will cause the camera to gently sway around while waiting for your input.

Configurable through GUIs as well as the '.minecraft/config/cameraoverhaul.toml' file.
"""
mod.authors = """
Mirsario
"""
mod.contributors = """
archiso86
altrisi
sam-mccarthy
IMS212
TheMrEngMan
Lucanoria
mpustovoi
TheLegendofSaram
stabery
czfortythree
Xinyang-Gao
"""
mod.forgeupdatecheckurl = "https://github.com/Mirsario/Minecraft-CameraOverhaul/blob/dev/meta/ForgeUpdateCheck.json?raw=true"

