modLoader = "javafml"
loaderVersion = "*"
license = "GPLv3"
issueTrackerURL = "https://github.com/Mirsario/Minecraft-CameraOverhaul/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = "${mod_description}"
logoFile = "assets/${mod_id}/icon.png"
logoBlur = false

[[mixins]]
config = "${mod_id}.mixins.json"

[["dependencies.${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_version_range}"